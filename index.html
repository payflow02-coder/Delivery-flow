<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Delivery Tracking</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<header>
  <h1>📦 Отслеживание доставки</h1>
  <a href="orders.html">Мои заказы</a>
</header>

<div class="tracker">
  <div class="steps">
    <div class="step active">Заказ</div>
    <div class="step">Сбор</div>
    <div class="step">Отправка</div>
    <div class="step">Доставка</div>
  </div>

  <div class="progress"><div id="bar"></div></div>

  <div id="content"></div>

  <button onclick="nextStep()">Следующий этап</button>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/notifications.js"></script>
</body>
</html>
